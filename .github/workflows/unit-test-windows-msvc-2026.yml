name: Unit Tests (Windows MSVC 2026)
on:
  pull_request:
  push:
    branches:
    - 'master'
    paths:
    - '.github/workflows/unit-test-windows-msvc-2026.yml'
    - 'tests/**'
    - 'third_party/unity/**'
    - 'src/common/**.c'
    - 'src/common/**.h'
permissions:
  contents: read
jobs:
  unit-test:
    name: Unit Test
    runs-on: windows-2025
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Visual Studio
      env:
        VISUAL_STUDIO_DIR: "C:\\Program Files\\Microsoft Visual Studio\\18\\Enterprise"
      run: |
        cmd.exe /c "call `"${{ env.VISUAL_STUDIO_DIR }}\VC\Auxiliary\Build\vcvars64.bat`" && set > %temp%\vcvars.txt"
        Get-Content "$env:temp\vcvars.txt" | Foreach-Object {
          if ($_ -match "^(.*?)=(.*)$") {
            $key=$matches[1].ToString()
            $value=$matches[2].ToString()
            echo "$key=$value" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf-8 -Append
          }
        }
    - name: Run unit tests
      run: cmd.exe /c "tests\vc_test.bat"
